<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Odin Project: Library</title>
</head>

<body>
    <div class="container">
        <div>
            <p>Visible books were created using fill data. If delete, they will return on page refresh.</p>
        </div>
        <h1>Book Library</h1>
        <button id="new-book">New Book</button>
        <div class="grid-container">
            <!-- Books -->
        </div>
    </div>

    <dialog id="my-dialog">
        <h2>Book information</h2>
        <form>
            <div>
                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div>
                <label for="author">Author</label>
                <input type="text" name="author" id="author" required>
            </div>
            <div>
                <label for="pages">Number of pages:</label>
                <input type="number" name="pages" id="pages" required>
            </div>
            <div>
                <label for="read">Read the book?</label>
                <input type="checkbox" name="read" id="read">
            </div>
            <div>
                <button id="add-book">Add Book</button>
                <button id="cancel">Cancel</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
